[package]
name = "nitroray"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nitro-ray-app"
path = "src/main.rs"

[dependencies]
xenofrost = { path = "../xenofrost" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.gltf]
version = "1"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]